name: Test & Deploy to Azure

on:
  push:
    branches:
      - main          # auto-deploy when PR is merged to main
  pull_request:
    branches:
      - main          # run tests on every PR (before merge)

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run tests on every push / PR
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx  # httpx needed for FastAPI TestClient

      - name: Run tests
        run: pytest tests/ -v

  # ─────────────────────────────────────────
